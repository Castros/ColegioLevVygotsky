version: '3.8'
# Shared-droplet variant — no Traefik (already running on the host).
# Joins the host's existing strapi_strapi-net so the shared Traefik picks up labels.
#
# Usage: ./scripts/add-to-droplet.sh <droplet-ip> <client-name> [env-file]
# CLIENT_NAME must be set — it namespaces containers, volumes, and Traefik routes.

services:
  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: ${CLIENT_NAME}-strapi
    restart: unless-stopped
    depends_on:
      strapi-db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      PUBLIC_URL: https://${STRAPI_DOMAIN}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${CLIENT_NAME}-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}
      GITHUB_BRANCH: ${GITHUB_BRANCH}
    networks:
      - strapi-net
    volumes:
      - /opt/strapi/${CLIENT_NAME}/uploads:/opt/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CLIENT_NAME}.rule=Host(`${STRAPI_DOMAIN}`)"
      - "traefik.http.routers.${CLIENT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${CLIENT_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${CLIENT_NAME}.loadbalancer.server.port=1337"
      - "traefik.http.middlewares.${CLIENT_NAME}-https.redirectscheme.scheme=https"
      - "traefik.http.routers.${CLIENT_NAME}-http.rule=Host(`${STRAPI_DOMAIN}`)"
      - "traefik.http.routers.${CLIENT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${CLIENT_NAME}-http.middlewares=${CLIENT_NAME}-https"
    command: npm run develop

  strapi-db:
    image: postgres:16-alpine
    container_name: ${CLIENT_NAME}-db
    restart: unless-stopped
    networks:
      - strapi-net
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - /opt/strapi/${CLIENT_NAME}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  strapi-net:
    external: true
    name: ${TRAEFIK_NETWORK:-strapi_strapi-net}
